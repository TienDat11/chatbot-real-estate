# CI for rag-real-estate monorepo.
# Gates:
#   be         — python compileall + pytest (non-e2e)          [push/PR]
#   web        — Next.js build + typecheck (dummy Firebase env) [push/PR]
#   deploy-be  — Cloud Run source deploy of ragre-api   [main push / dispatch]
#   deploy-web — FE image via Cloud Build + ragre-web   [main push / dispatch]
# The deploy jobs run only after be + web pass, and only on refs/heads/main.
name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
  workflow_dispatch:

# Top-level lockdown: no token permissions anywhere unless a job declares
# exactly what it needs (each deploy job declares contents:read + id-token:write).
permissions: {}

# Never kill an in-flight production deploy; a newer run just waits queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  be:
    name: Backend — compileall + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Compile check (api, ingest)
        run: python -m compileall -q api ingest

      # Unit tests (non-e2e) — media/CDN tests resolve URLs through the
      # settings below. Synthetic placeholders (never real credentials): the
      # real R2_PUBLIC_URL / IMAGE_CDN_PROJECT_MAP come from .env on the dev
      # machine and from Secret Manager in production.
      - name: Unit tests (non-e2e)
        env:
          R2_PUBLIC_URL: https://pub-ci-dummy.r2.dev
          IMAGE_CDN_PROJECT_MAP: '{"camellia":"https://cdn-ci-dummy.example"}'
        run: pytest -q -m "not e2e"

  # Advisory quality diagnostics. Deliberately NOT in the deploy jobs' `needs`:
  # ruff debt must never be able to block a production deploy, and a separate
  # job makes that structural instead of resting on a `continue-on-error` flag
  # inside the gating job that someone could later flip.
  #
  # The count below is a non-contractual baseline, measured 2026-09-14 with
  # ruff 0.16.3 over `api ingest eval tests`: 399 findings. It drifts by design —
  # requirements.txt does not pin ruff, and target-version py311 exposes
  # py3.10+ syntax that the old py39 target accepted.
  #
  # `ruff format --check` is deliberately absent: ruff 0.16.3 CRASHES on
  # api/domain/__init__.py ("Annotation range 0..4 is beyond the end of
  # buffer"), so the job would fail for tooling reasons, not code reasons.
  quality-advisory:
    name: Quality — ruff (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # Job-level, not step-level: ruff exits non-zero on every finding, so
    # without this the whole RUN would conclude "failure" on the 399 known
    # findings — a permanently red CI that people learn to ignore. This keeps
    # the job itself red and readable (the diagnostic is not hidden) while the
    # run's conclusion, and therefore the deploy signal, stays clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # No output filtering: a crashed or missing ruff must not look like a
      # clean run. Findings exit non-zero, this step goes red, the job goes red -
      # only the run's conclusion is shielded, by the job-level flag above.
      - name: Ruff lint
        run: python -m ruff check api ingest eval tests --statistics

  web:
    name: Web — build + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Workspace libs (@rag-ragre/contracts, @rag-ragre/ui) export only ./dist
      # (gitignored), so compile them before next build / typecheck resolve them.
      - name: Build workspace libs
        run: npm run build:libs

      # CI gate placeholders only — never real credentials.
      # apps/web fails the build when any NEXT_PUBLIC_FIREBASE_* var is missing;
      # these dummy values satisfy the build gate and are never shipped.
      - name: Write dummy Firebase env for build gate
        run: |
          cat > apps/web/.env.local <<'EOF'
          # CI gate placeholders only — never real credentials
          NEXT_PUBLIC_FIREBASE_API_KEY=ci-dummy-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=ci-dummy.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=ci-dummy-project
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=ci-dummy-project.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=000000000000
          NEXT_PUBLIC_FIREBASE_APP_ID=1:000000000000:web:cidummy
          EOF

      # Fail-fast order: cheap static checks before the expensive build, so a
      # lint or type error reports in seconds instead of after a full next build.
      - name: Lint
        run: npm run lint -w @rag-ragre/web

      - name: Typecheck
        run: npm run typecheck

      # Tests run before the (slower) production build so a logic failure
      # reports without waiting on a full next build. The UI suite carries the
      # trust-safety component contracts (ReviewBanner / ConfidenceBadge).
      - name: Unit tests (ui)
        run: npm run test -w @rag-ragre/ui

      - name: Build web workspace
        run: npm run build --workspace=@rag-ragre/web

  # Production deploys. Both jobs are gated to refs/heads/main only, even for
  # workflow_dispatch: dispatch can be triggered on any ref, and a deploy on a
  # branch ref would hand production OIDC credentials to branch-controlled code.
  # They still need [be, web], so the test gates run first on every push/PR.
  #
  # Auth is Workload Identity Federation (no long-lived SA keys). The
  # service_account input is required: the WIF pool binding only grants the
  # GitHub principal permission to IMPERSONATE github-deployer@..., and that SA
  # is the identity holding run.admin / cloudbuild.builds.editor / storage
  # roles. Without it the federated token has no roles and the deploy 403s.
  #
  # One-time GCP setup this file depends on (project sale-chat-ai), all of it
  # outside the repo and therefore invisible to a code review:
  #   - one WIF provider PER repository, each pinning its own
  #     assertion.repository (github-oidc for the personal repo,
  #     github-oidc-saleai for this one), plus roles/iam.workloadIdentityUser
  #     for that repo's principalSet on github-deployer@.
  #   - github-deployer@ at project level: run.admin, cloudbuild.builds.editor,
  #     artifactregistry.writer, logging.logWriter, roles/storage.bucketViewer
  #     (gcloud resolves its staging bucket by LISTING buckets, so bucket-level
  #     grants alone are not enough) and roles/serviceusage.serviceUsageConsumer
  #     (required by gcloud builds submit).
  #   - object WRITE stays bucket-scoped, never project-wide: only
  #     gs://run-sources-sale-chat-ai-asia-southeast1 and
  #     gs://sale-chat-ai_cloudbuild grant github-deployer
  #     roles/storage.objectAdmin.
  #   - roles/iam.serviceAccountUser on the runtime service account
  #     (448504678237-compute@) so the deploy may act as it.
  deploy-be:
    name: Deploy backend — Cloud Run
    needs: [be, web]
    if: |
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Serialise against an in-flight backend deploy; never cancel one.
    concurrency:
      group: deploy-be-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-deployer@sale-chat-ai.iam.gserviceaccount.com
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@v2

      # Deliberately no env/secret override flags here: gcloud replaces the
      # whole env and secretKeyRefs sets with whatever such a flag names, so any
      # list baked into this file would silently drop or downgrade live
      # production config (it goes stale the moment someone edits the serving
      # revision). `gcloud run deploy --source` creates a new revision that
      # inherits env + secretKeyRefs from the currently serving one, which is
      # exactly the behaviour we want.
      #
      # Scaling and CPU billing are pinned explicitly. `gcloud run deploy`
      # inherits any flag it is not given from the currently serving revision, so
      # a setting that lives only in an old revision silently re-applies forever.
      # Pinning --cpu-throttling bills CPU only while a request is in flight;
      # --no-cpu-throttling billed every idle instance 24/7 and let 36
      # always-CPU revisions accumulate (2026-10-12 audit).
      # --max-instances=2 matches the live service template; 20 allowed a spam
      # burst to multiply the instance count tenfold.
      # --min-instances=0 scales to zero between requests, so an idle window
      # costs nothing; the first request after that pays LightRAG's ~30-40s cold
      # init. Background asyncio tasks (lead mirror reconciliation, chat history
      # retention) only make progress while a request is in flight.
      - name: Deploy to Cloud Run
        run: >-
          gcloud run deploy ragre-api
          --source .
          --region asia-southeast1
          --quiet
          --cpu-throttling
          --min-instances=0
          --max-instances=2
          --cpu-boost
          --timeout=360
          --startup-probe=periodSeconds=10,timeoutSeconds=5,failureThreshold=8,httpGet.path=/ready,httpGet.port=8080

  # FE ships as a prebuilt image: npm workspaces need the monorepo root context,
  # which `gcloud run deploy --source apps/web` cannot provide, so the build
  # goes through Cloud Build with deploy/cloudbuild-web.yaml.
  deploy-web:
    name: Deploy web — Cloud Build + Cloud Run
    needs: [be, web]
    if: |
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Serialise against an in-flight frontend deploy; never cancel one.
    concurrency:
      group: deploy-web-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-deployer@sale-chat-ai.iam.gserviceaccount.com
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@v2

      # NEXT_PUBLIC_* values are baked into the image at BUILD time, so an unset
      # repository variable would produce (and deploy) a silently broken FE.
      # Fail the job before spending build minutes instead.
      - name: Assert FE build variables are set
        env:
          FE_FIREBASE_API_KEY: ${{ vars.FE_FIREBASE_API_KEY }}
          FE_FIREBASE_AUTH_DOMAIN: ${{ vars.FE_FIREBASE_AUTH_DOMAIN }}
          FE_FIREBASE_PROJECT_ID: ${{ vars.FE_FIREBASE_PROJECT_ID }}
          FE_FIREBASE_STORAGE_BUCKET: ${{ vars.FE_FIREBASE_STORAGE_BUCKET }}
          FE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FE_FIREBASE_MESSAGING_SENDER_ID }}
          FE_FIREBASE_APP_ID: ${{ vars.FE_FIREBASE_APP_ID }}
          FE_FIREBASE_VAPID_KEY: ${{ vars.FE_FIREBASE_VAPID_KEY }}
          FE_MEDIA_ORIGINS_JSON: ${{ vars.FE_MEDIA_ORIGINS_JSON }}
          FE_API_PROXY_TARGET: ${{ vars.FE_API_PROXY_TARGET }}
        run: |
          missing=0
          for v in FE_FIREBASE_API_KEY FE_FIREBASE_AUTH_DOMAIN FE_FIREBASE_PROJECT_ID \
                   FE_FIREBASE_STORAGE_BUCKET FE_FIREBASE_MESSAGING_SENDER_ID \
                   FE_FIREBASE_APP_ID FE_FIREBASE_VAPID_KEY FE_MEDIA_ORIGINS_JSON \
                   FE_API_PROXY_TARGET; do
            if [ -z "${!v}" ]; then
              echo "::error::Repository variable $v is empty or unset; refusing to build a broken FE image."
              missing=1
            fi
          done
          exit "$missing"

      # Substitutions use gcloud's alternate delimiter (^@^ separators). The
      # media-origins value is JSON, and plain JSON loses its double quotes on
      # the way into Cloud Build substitutions — the alternate delimiter does
      # keep the commas, but a quote-stripped array is unparseable all the same
      # (build 6363ea95 recorded [{origin:https://...}] that way, so the
      # deployed FE dropped every R2 image).
      # It is passed base64-encoded instead: base64 has no quotes, commas,
      # whitespace or '@', so no hop can mangle it. Single quotes keep the
      # braces/quotes in the other values away from bash; the base64 value is
      # spliced in with double quotes.
      - name: Build FE image via Cloud Build
        env:
          FE_MEDIA_ORIGINS_JSON: ${{ vars.FE_MEDIA_ORIGINS_JSON }}
        run: |
          MEDIA_ORIGINS_B64="$(printf '%s' "$FE_MEDIA_ORIGINS_JSON" | base64 -w0)"
          gcloud builds submit \
            --config deploy/cloudbuild-web.yaml \
            --region asia-southeast1 \
            --quiet \
            --substitutions '^@^_FE_API_KEY=${{ vars.FE_FIREBASE_API_KEY }}@_FE_AUTH_DOMAIN=${{ vars.FE_FIREBASE_AUTH_DOMAIN }}@_FE_PROJECT_ID=${{ vars.FE_FIREBASE_PROJECT_ID }}@_FE_STORAGE_BUCKET=${{ vars.FE_FIREBASE_STORAGE_BUCKET }}@_FE_SENDER_ID=${{ vars.FE_FIREBASE_MESSAGING_SENDER_ID }}@_FE_APP_ID=${{ vars.FE_FIREBASE_APP_ID }}@_FE_VAPID_KEY=${{ vars.FE_FIREBASE_VAPID_KEY }}@_FE_MEDIA_ORIGINS_JSON_B64='"${MEDIA_ORIGINS_B64}"'@_FE_PROXY_TARGET=${{ vars.FE_API_PROXY_TARGET }}' \
            .

      # No env flags on purpose: the new revision inherits the live ragre-web
      # config, and its only runtime variable (NEXT_PUBLIC_API_PROXY_TARGET) is
      # baked into the image at build time by _FE_PROXY_TARGET above.
      - name: Deploy FE to Cloud Run
        run: >-
          gcloud run deploy ragre-web
          --image asia-southeast1-docker.pkg.dev/sale-chat-ai/ragre/ragre-web:latest
          --region asia-southeast1
          --quiet
