# CI for rag-real-estate monorepo.
# Gates:
#   be  — python compileall + pytest (non-e2e)          [push/PR]
#   web — Next.js build + typecheck (dummy Firebase env) [push/PR]
#   deploy-be — Cloud Run source deploy                  [manual dispatch ONLY]
name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
  workflow_dispatch:

# Top-level lockdown: no token permissions anywhere unless a job declares
# exactly what it needs (deploy-be declares contents:read + id-token:write).
permissions: {}

# Never kill an in-flight production deploy; a newer run just waits queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  be:
    name: Backend — compileall + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Compile check (api, ingest)
        run: python -m compileall -q api ingest

      - name: Unit tests (non-e2e)
        run: pytest -q -m "not e2e"

  web:
    name: Web — build + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Workspace libs (@rag-ragre/contracts, @rag-ragre/ui) export only ./dist
      # (gitignored), so compile them before next build / typecheck resolve them.
      - name: Build workspace libs
        run: npm run build:libs

      # CI gate placeholders only — never real credentials.
      # apps/web fails the build when any NEXT_PUBLIC_FIREBASE_* var is missing;
      # these dummy values satisfy the build gate and are never shipped.
      - name: Write dummy Firebase env for build gate
        run: |
          cat > apps/web/.env.local <<'EOF'
          # CI gate placeholders only — never real credentials
          NEXT_PUBLIC_FIREBASE_API_KEY=ci-dummy-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=ci-dummy.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=ci-dummy-project
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=ci-dummy-project.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=000000000000
          NEXT_PUBLIC_FIREBASE_APP_ID=1:000000000000:web:cidummy
          EOF

      - name: Build web workspace
        run: npm run build --workspace=@rag-ragre/web

      - name: Typecheck
        run: npm run typecheck

  # Manual-dispatch-only policy: this job deploys to production Cloud Run
  # (ragre-api) with real secrets mounted via Secret Manager. It never runs on
  # push/PR to avoid secret exposure on untrusted branches and to force an
  # explicit human approval step (dispatch) before every production deploy.
  deploy-be:
    name: Deploy backend — Cloud Run
    needs: [be, web]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Prefer Workload Identity Federation over long-lived SA keys.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@v2

      # NOTE: if CORS_ORIGINS contains commas it must be escaped (\x2C)
      # because comma is the --set-env-vars separator.
      - name: Deploy to Cloud Run
        run: >-
          gcloud run deploy ragre-api
          --source .
          --region asia-southeast1
          --min-instances=1
          --cpu-boost
          --no-cpu-throttling
          --timeout=360
          --startup-probe=periodSeconds=10,timeoutSeconds=5,failureThreshold=8,httpGet.path=/ready,httpGet.port=8080
          --set-secrets "POSTGRES_PASSWORD:latest,ANON_IDENTITY_SECRET:latest,LEAD_MIRROR_HMAC_SECRET:latest,LLM_API_KEY:latest,EMBEDDING_API_KEY:latest,RERANK_API_KEY:latest,FIREBASE_SERVICE_ACCOUNT_PRIVATE_KEY:latest,R2_SECRET_ACCESS_KEY:latest"
          --set-env-vars "APP_ENV=prod,POSTGRES_HOST=aws-1-ap-southeast-1.pooler.supabase.com,POSTGRES_PORT=5432,POSTGRES_USER=postgres.wlvxhmzjyomtzwboehsd,POSTGRES_DATABASE=postgres,POSTGRES_MAX_CONNECTIONS=10,EMBEDDING_DIM=1024,RAG_PREWARM_ENABLED=true,CORS_ORIGINS=${{ vars.CORS_ORIGINS }},EMBEDDING_BINDING=gemini,RERANK_BINDING=aibox"
