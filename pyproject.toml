# Python tooling config — ruff (lint + format) chuẩn toàn team
# Chạy: .venv/Scripts/python -m ruff check . && .venv/Scripts/python -m ruff format .
[tool.ruff]
line-length = 100
# Runtime is Python 3.11 (CI setup-python, Dockerfile, .venv). Declaring py39
# under-reported py3.10+ syntax (X | None, asyncio.TimeoutError alias) as valid.
target-version = "py311"
exclude = [".venv", "node_modules", "docs", "_bmad"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"api/interfaces/api/admin_routes.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: real-browser end-to-end tests (need FE+BE dev servers; tests/e2e)",
]